[workspace]
members = [".", "rt"]
default-members = [".", "rt"]

[package]
name = "cleatc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cleatc"
path = "src/main.rs"

[lib]
name = "cleatc"
path = "src/lib.rs"

[dependencies]
num-bigint = "0.5.1"
# Without its own `num-bigint`, which is an older one: `sema::program::BigRational` is the
# ratio over the `BigInt` above.
num-rational = { version = "0.4.2", default-features = false, features = ["std"] }
num-traits = "0.2.19"

# The runtime is linked into every compiled program, so it is optimized even in a
# development build.
[profile.dev.package.cleatrt]
opt-level = 2
