[workspace]
members = [".", "rt"]
default-members = [".", "rt"]

[package]
name = "cleatc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cleatc"
path = "src/main.rs"

[lib]
name = "cleatc"
path = "src/lib.rs"

[dependencies]
cleatrt = { path = "rt" }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"

# The runtime is linked into every compiled program, so it is optimized even in a
# development build.
[profile.dev.package.cleatrt]
opt-level = 2
